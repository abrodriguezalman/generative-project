<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <title>Untitled</title>
  </head>
  <body>
    <div id="radio-container"></div>
  </body>
</html>

<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library/build/nn.min.js"></script>

<script>
  /*global nn*/
  let radioImg
  let canvas
  let currentStation = 0
  
  const songs = Object.fromEntries(Array.from({
    length: 11 - 1 + 1
  }, (_, i) => [115 + (i * 55), 1 + i]));
  
  let currSong
  
  async function setUp () {
    currSong = new Audio(`songs/track1.mp3`);
    const url = 'radio.jpeg' 
    radioImg = await nn.loadImage(url) 
    
   // const width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth; //replacement for nn.width
  //const height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight; //replacement for nn.height

    canvas = nn.create('canvas')
      .resize(radioImg.width, radioImg.height) 
      .css('position', 'absolute')
      .css('left', `${(nn.width - radioImg.width) / 2}px`)
      .css('top', `${(nn.height - radioImg.height) / 2}px`)
      .addTo('#radio-container')

    canvas.drawImage(radioImg, 0, 0)

    canvas.strokeStyle = 'red'
    canvas.line(115, 150, 115, 50)
    currSong.play()
    currSong.loop = true
  }
  
  const roundToNearest5 = (num) => Math.round(num / 5) * 5;
  
  function draw () {
    if (!nn.mouseDown) return

    canvas.clear()

    canvas.drawImage(radioImg, 0, 0)

    canvas.strokeStyle = 'red'

    const canvasRect = canvas.getBoundingClientRect();
    
    let x = Math.round(nn.mouseX - canvasRect.left);

    if (x < 115) {
      x = 115; //cap at 115
    } else if (x > 665) {
      x = 665; //cap at 300 
    }

    canvas.line(x, 150, x, 50)
    const newStation = roundToNearest5(x)
    
    if (newStation !== currentStation){
      playMusic(newStation)
    }
  }

  function playMusic (station) {

    if (station in songs){
      currSong.src = `songs/track${songs[station]}.mp3`
      currSong.load();      
      currSong.play();
     // songChanged = true
    } else{
      currSong.src = 'songs/radio-static.mp3';
      currSong.load();      
      currSong.play();
     // songChanged = false
    }
  }

  nn.on('load', setUp)
  nn.on('mousemove', draw)
</script>
