<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library/build/nn.min.js"></script>

<script>
/*global nn*/
  let canvas
  
  function canvasMaker() {
    canvas = nn.create('canvas')
    .resize(nn.width, nn.height)
    .css('background-color', 'blue')
    .addTo('body')
  }
  
  function drawStick(){
    canvas.line(nn.mouseX, 50, nn.mouseX, 80)
    .css('stroke', 'red')
  }

  nn.on('load', canvasMaker)
  nn.on('click', drawStick)
</script>
