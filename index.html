  <style>
    .word {
      animation-name: fadeInOut;
      animation-duration: 8s;
      animation-fill-mode: forwards;
    }

    @keyframes fadeInOut {
      0% {
        opacity: 0;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }
  </style>
  <body>
    <div id="lyric-container"></div>
    <div id="radio-container"></div>
    <div id="intro-container"></div>
  </body>
</html>

  async function setUp () {

    nn.get('body').css('background-color', 'black')

    currSong = new Audio(`songs/track1.mp3`);
    const url = 'radio.jpeg'
    radioImg = await nn.loadImage(url)

    canvas = nn.create('canvas')
      .resize(radioImg.width, radioImg.height)
      .css('position', 'absolute')
      .css('left', `${(nn.width - radioImg.width) / 2}px`)
      .css('top', `${(nn.height - radioImg.height) / 2}px`)
      .addTo('#radio-container')

    canvas.drawImage(radioImg, 0, 0)

    canvas.strokeStyle = 'red'
    canvas.lineWidth = 3
    canvas.line(115, 150, 115, 50)
    currSong.play()
    currSong.loop = true

    nn.get('#lyric-container')
      .css('position', 'absolute')
      .css('left', '0px')
      .css('top', '0px')
      .css('width', `${nn.width}px`)
      .css('height', `${(nn.height - radioImg.height) / 2}px`)
    
    currentKeywords = lyrics[currentStation]
    
    nn.get('#intro-container')
      .css('position', 'absolute')
      .css('left', '10px')
      .css('top', `${(nn.height - radioImg.height)}px`)
      .css('width', `${nn.width-10}px`)
    
    nn.create('p')
    .content("Sounds of Resistance. CONTENT WARNING: Graphic Descriptions of Violence and Other Sensitive Topics. Beliefs shared here are not the author's own. Proceed with caution.")
    .css('color', 'red')
    .css('font-size', '16px')
    .css('text-align', 'center')
    .addTo('#intro-container')
  }

  const roundToNearest5 = (num) => Math.round(num / 5) * 5;

  function draw () {
    if (!nn.mouseDown) return

    canvas.clear()

    canvas.drawImage(radioImg, 0, 0)

    canvas.strokeStyle = 'red'

    const canvasRect = canvas.getBoundingClientRect();

    let x = Math.round(nn.mouseX - canvasRect.left);

    if (x < 115) {
      x = 115; //cap at 115
    } else if (x > 665) {
      x = 665; //cap at 300 
    }

    canvas.line(x, 150, x, 50)
    const newStation = roundToNearest5(x)

    if (newStation !== currentStation) {
      currentStation = newStation
      if (!(newStation in songs)) {
        currentKeywords = ['']
      } else {
        currentKeywords = lyrics[songs[currentStation] - 1]
      }
      playMusic(newStation)
    }
  }

  function playMusic (station) {

    if (station in songs) {
      currSong.src = `songs/track${songs[station]}.mp3`
      currSong.load();
      currSong.play();
    } else {
      currSong.src = 'songs/radio-static.mp3';
      currSong.load();
      currSong.play();
    }
  }

  function displayLyrics () {
    if (activeWords.length >= maxWordsOnScreen) return
    if (!currentKeywords.length) return

    const word = nn.random(currentKeywords)
    const wordId = nextWordId++
    const wordEl = nn.create('p')
      .content(`${word}`)
      .set('id', `word-${wordId}`)
      .css('position', 'absolute')
      .css('color', 'red')
      .css('font-size', '24px')
      .set('class', 'word')

    randomLocation(wordEl)

    wordEl.addTo('#lyric-container')
    activeWords.push(wordEl)

    wordEl.addEventListener('animationend', () => {
      wordEl.remove()
      const idx = activeWords.indexOf(wordEl)
      if (idx !== -1) {
        activeWords.splice(idx, 1)
      }
    });
  }

  function randomLocation (wordEl) {
    const cont = nn.get('#lyric-container').getBoundingClientRect()
    const padding = 30
    const maxX = cont.width - padding
    const maxY = cont.height - padding
    x = nn.randomInt(padding, maxX)
    y = nn.randomInt(padding, maxY)

    wordEl
      .css('left', `${x}px`)
      .css('top', `${y}px`)
      .css('right', `${x}px`)
      .css('top', `${y}px`)
  }

  function startLyricTimer () {
    setInterval(() => {
      displayLyrics(currentStation)
    }, 1000);
  }


  nn.on('load', setUp)
  nn.on('load', startLyricTimer)
  nn.on('mousemove', draw)
</script>
